<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Eduardo Quispe Ramírez — Civil Engineer and BIM Developer</title>
  <desc id="desc">Professional banner inspired by civil infrastructure, Civil 3D geometry and software development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B2239"/>
      <stop offset="1" stop-color="#103A52"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D6ED"/>
      <stop offset="1" stop-color="#80FFDB"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#79A8C4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 286 C155 230 242 330 397 277 S672 226 835 275 S1108 338 1280 264" fill="none" stroke="#55B6D0" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M0 302 C155 246 242 346 397 293 S672 242 835 291 S1108 354 1280 280" fill="none" stroke="#55B6D0" stroke-opacity=".09" stroke-width="1.5"/>
  <path d="M0 318 C155 262 242 362 397 309 S672 258 835 307 S1108 370 1280 296" fill="none" stroke="#55B6D0" stroke-opacity=".07" stroke-width="1.5"/>

