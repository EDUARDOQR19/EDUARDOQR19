      <path d="M0 17C42-7 70 34 113 13s74-15 112 2 70 20 113-4" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
      <g fill="#081929" stroke="#70FFD4" stroke-width="2">
