  <text x="70" y="329" fill="#7FA5BA" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">DESIGNING INFRASTRUCTURE. ENGINEERING SOFTWARE. AUTOMATING THE FUTURE.</text>
