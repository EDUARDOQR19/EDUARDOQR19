<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Eduardo Quispe Ramírez — Civil Engineer, BIM and Automation Developer</title>
  <desc id="desc">A technology-forward banner combining civil infrastructure geometry, BIM data and artificial intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset=".48" stop-color="#0A2034"/>
      <stop offset="1" stop-color="#123C4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29D8FF"/>
      <stop offset=".48" stop-color="#70FFD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#5DE8FF" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#5DE8FF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#5DE8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A8E6F3" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="390" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="390" rx="24" fill="url(#grid)"/>
  <circle cx="1028" cy="188" r="250" fill="url(#orb)"/>

  <g fill="none" stroke="#59C8DB" stroke-opacity=".11" stroke-width="1.2">
    <path d="M-30 304C106 247 194 343 339 294S580 240 709 284"/>
    <path d="M-30 321C106 264 194 360 339 311S580 257 709 301"/>
    <path d="M-30 338C106 281 194 377 339 328S580 274 709 318"/>
    <path d="M-30 355C106 298 194 394 339 345S580 291 709 335"/>
  </g>

  <g transform="translate(66 52)">
