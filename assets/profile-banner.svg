    <text x="0" y="201" fill="#80FFDB" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.2">CIVIL ENGINEER × BIM DEVELOPER</text>
    <text x="0" y="235" fill="#AFC7D8" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing=".9">AUTODESK CIVIL 3D API · .NET / C# · BIM AUTOMATION</text>
  </g>

  <g transform="translate(772 47)">
    <rect width="437" height="252" rx="18" fill="#06101D" fill-opacity=".74" stroke="#6FE8F4" stroke-opacity=".24"/>
