    <text x="79" y="20" fill="#B8F5FF" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.8">UNI · PERÚ</text>

    <text x="0" y="89" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing=".6">PEDRO EDUARDO</text>
    <text x="0" y="137" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing=".6">QUISPE RAMÍREZ</text>

