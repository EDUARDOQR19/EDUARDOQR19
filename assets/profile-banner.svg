    <text x="82" y="81" fill="#D9E7F0" font-family="Consolas,monospace" font-size="14">class</text>
    <text x="132" y="81" fill="#80FFDB" font-family="Consolas,monospace" font-size="14">BimDeveloper</text>
    <text x="24" y="108" fill="#7899AE" font-family="Consolas,monospace" font-size="14">{</text>
    <text x="44" y="137" fill="#D9E7F0" font-family="Consolas,monospace" font-size="14">Civil3D.Api</text>
    <text x="157" y="137" fill="#FFB86B" font-family="Consolas,monospace" font-size="14">→</text>
    <text x="181" y="137" fill="#AFC7D8" font-family="Consolas,monospace" font-size="14">SmartTools;</text>
    <text x="44" y="166" fill="#D9E7F0" font-family="Consolas,monospace" font-size="14">BIM.Data</text>
    <text x="132" y="166" fill="#FFB86B" font-family="Consolas,monospace" font-size="14">→</text>
    <text x="156" y="166" fill="#AFC7D8" font-family="Consolas,monospace" font-size="14">Decisions;</text>
    <text x="44" y="195" fill="#D9E7F0" font-family="Consolas,monospace" font-size="14">Engineering</text>
    <text x="149" y="195" fill="#FFB86B" font-family="Consolas,monospace" font-size="14">→</text>
    <text x="173" y="195" fill="#AFC7D8" font-family="Consolas,monospace" font-size="14">Automation;</text>
    <text x="24" y="224" fill="#7899AE" font-family="Consolas,monospace" font-size="14">}</text>

    <path d="M242 220 C277 199 288 151 325 145 S373 173 406 102" fill="none" stroke="url(#road)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#07111F" stroke="#80FFDB" stroke-width="2">
